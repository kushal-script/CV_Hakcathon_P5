experiment:
  id: "2026-11-06_15-40-53"
  title: "E09+E10: crop and augmentation ablations (TResNet-M, 15 epochs)"
  type: "ablation"
  seed: 42

data:
  root: data/stanford_cars
  split: {train: 0.9, val: 0.1, stratified: true}
  crop: gt_bbox
  crop_padding: 0.10
  box_jitter: {scale: 0.10, shift: 0.05}
  image_size: 368

model:
  backbone: tresnet_l.miil_in1k_448
  pretrained: true
  heads: [class_196]

train:
  optimizer: adamw
  lr: 2.0e-4
  head_lr: 2.0e-3
  weight_decay: 0.05
  epochs: 40
  batch_size: 32
  schedule: cosine
  warmup_epochs: 2
  label_smoothing: 0.1
  augment: [hflip, randaugment_n2_m7, downscale_p0.2, clahe_gamma_p0.2, random_erasing_p0.25]
  amp: true

classical:
  preprocess: []
  features: []
  classifier: null

eval:
  splits: [val]
  tta: false
  temperature_scaling: false
