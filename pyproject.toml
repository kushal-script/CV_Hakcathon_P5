[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p5"
version = "0.1.0"
description = "Fine-grained vehicle recognition on Stanford Cars: hybrid classical and deep pipeline"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow", "pandas", "pyyaml", "opencv-contrib-python-headless"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
