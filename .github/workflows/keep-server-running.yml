name: Keep the live server running

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resume vahana-host if JarvisLabs paused it
        env:
          JL_API_KEY: ${{ secrets.JL_API_KEY }}
        run: |
          if [ -z "$JL_API_KEY" ]; then echo "Add the JL_API_KEY repository secret to turn this check on"; exit 0; fi
          python3 -m pip install --quiet --disable-pip-version-check jarvislabs==0.2.16
          python3 - <<'EOF'
          import json, subprocess, sys
          listing = json.loads(subprocess.run(["jl", "list", "--json"], capture_output=True, text=True, check=True).stdout)
          rows = listing if isinstance(listing, list) else listing.get("instances", listing.get("data", []))
          host = next((r for r in rows if r.get("name") == "vahana-host"), None)
          if host is None:
              sys.exit("vahana-host was not found in the JarvisLabs account")
          print("vahana-host", host.get("machine_id"), host.get("status"))
          if host.get("status") == "Paused":
              out = subprocess.run(["jl", "resume", str(host["machine_id"]), "--yes", "--json"], capture_output=True, text=True)
              print(out.stdout.strip()[-400:])
              if out.returncode:
                  sys.exit(out.stderr.strip()[-400:] or "resume failed")
          EOF
