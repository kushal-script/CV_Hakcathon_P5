[package]
name = "vahana-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "io-std", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
