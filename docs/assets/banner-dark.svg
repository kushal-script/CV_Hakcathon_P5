<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="title desc">
<title id="title">Vahana Drishti</title>
<desc id="desc">Vehicle intelligence for police stations across Bengaluru, drawn like the console's sign-in page: Vidhana Soudha, a rain tree, a traffic signal, a Namma Metro train and an auto-rickshaw.</desc>
<style>
.bg { fill: #3a2f20; }
.over { font: 700 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; letter-spacing: .14em; fill: #d9c193; }
.over .kn { letter-spacing: 0; font-weight: 600; }
.title { font: 600 68px 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; letter-spacing: -.02em; fill: #f0e7d6; }
.kn { font-family: 'Noto Sans Kannada', 'Kannada Sangam MN', 'Kannada MN', Tunga, 'Nirmala UI', sans-serif; }
.ktitle { font: 600 28px 'Noto Sans Kannada', 'Kannada Sangam MN', 'Kannada MN', Tunga, 'Nirmala UI', sans-serif; fill: #d9c193; }
.lede { font: 400 18.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; fill: #d2c4ab; }
.div { font: 650 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; fill: #f0e7d6; }
.divk { font: 500 14px 'Noto Sans Kannada', 'Kannada Sangam MN', 'Kannada MN', Tunga, 'Nirmala UI', sans-serif; fill: #d9c193; }
.rule { stroke: rgba(217,193,147,0.3); stroke-width: 1; }
.meta { font: 700 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; letter-spacing: .12em; fill: #9b8c73; }
.sep { stroke: rgba(217,193,147,0.25); stroke-width: 1; }
.draw { fill: none; stroke: #d9c193; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.thin { stroke-width: 1.25; }
.sun { fill: rgba(231,181,91,0.22); }
.lamp { fill: #2a231a; stroke: #d9c193; stroke-width: 1.5; }
#lamp-r { animation: lamp-red 1.5s 2; }
#lamp-a { animation: lamp-amber 1.5s 2; }
#lamp-g { fill: #5fbf6a; animation: lamp-green 1.5s 2; }
.lane { fill: none; stroke: #d9c193; stroke-width: 3; stroke-dasharray: 26 22; opacity: .55; animation: lane .7s linear 4; }
@keyframes lane { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
@keyframes lamp-red { 0%, 32% { fill: #e0503a; } 33%, 100% { fill: #2a231a; } }
@keyframes lamp-amber { 0%, 32% { fill: #2a231a; } 33%, 65% { fill: #f0b03a; } 66%, 100% { fill: #2a231a; } }
@keyframes lamp-green { 0%, 65% { fill: #2a231a; } 66%, 100% { fill: #5fbf6a; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><clipPath id="card"><rect width="1280" height="440" rx="18"/></clipPath></defs>
<g clip-path="url(#card)">
<rect class="bg" width="1280" height="440"/>
<rect width="640.0" height="6" fill="#e2ad2e"/><rect x="640.0" width="640.0" height="6" fill="#b3392b"/>
<text class="over" x="64" y="78">BENGALURU<tspan class="kn" dx="10">ಬೆಂಗಳೂರು</tspan></text>
<text class="meta" x="1216" y="78" text-anchor="end">COMPUTER VISION HACKATHON 2026 · P5 · TEAM T55</text>
<text class="title" x="61" y="152">Vahana Drishti</text>
<text class="ktitle" x="64" y="196">ವಾಹನ ದೃಷ್ಟಿ</text>
<text class="lede" x="64" y="238">Vehicle intelligence for police stations across</text><text class="lede" x="64" y="265">the city. Identify a vehicle from a photo, find it</text><text class="lede" x="64" y="292">across camera feeds and reconstruct where it went.</text>
