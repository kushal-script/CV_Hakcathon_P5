<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" width="760" height="132" role="img" aria-labelledby="title">
<title id="title">Live demo: www.vahanadrishti.in</title>
<style>
.label { font: 700 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; letter-spacing: .18em; fill: #5c4a2c; }
.url { font: 600 42px 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; letter-spacing: -.01em; fill: #1d1811; }
.ring { fill: none; stroke: #5c4a2c; stroke-width: 2; }
.arrow { fill: none; stroke: #1d1811; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.glow { fill: #5fbf6a; opacity: .35; animation: glow 2.4s ease-in-out infinite; transform-origin: 51px 88px; }
@keyframes glow { 50% { opacity: .08; transform: scale(1.5); } }
@media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
</style>
